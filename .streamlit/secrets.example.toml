# Copy this file to .streamlit/secrets.toml (already gitignored), or paste its
# contents into Streamlit Community Cloud → app settings → Secrets.
#
# Only needed to read from a private bucket. Leave it alone for local work.

# Which bucket to read.
GCS_BUCKET = "your-bucket-name"
GCS_PREFIX = ""                    # optional sub-path inside the bucket

# Paste the service-account JSON key you downloaded from Google Cloud here.
# The field names below are exactly the ones in that file, so it is a
# copy-paste, value for value. Keep the \n escapes in private_key as they
# appear in the JSON.
[connections.gcs]
type = "service_account"
project_id = "xxx"
private_key_id = "xxx"
private_key = "-----BEGIN PRIVATE KEY-----\nxxx\n-----END PRIVATE KEY-----\n"
client_email = "xxx"
client_id = "xxx"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "xxx"
